<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DFD Level 0 Context Diagram - Bon Laundry</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
  }
</style>
</head>
<body>

<svg width="1800" height="1100" viewBox="0 0 1800 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- TITLE -->
  <text x="900" y="55" text-anchor="middle" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="0.5">
    DATA FLOW DIAGRAM (DFD) — LEVEL 0: CONTEXT DIAGRAM
  </text>
  <text x="900" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">
    Bon Laundry Shop Management System with Predictive Analytics
  </text>

  <!-- ==================== CENTRAL PROCESS (0.0) ==================== -->
  <g transform="translate(900, 560)">
    <!-- Shadow & Circle -->
    <circle cx="0" cy="0" r="165" fill="#f0f9ff" stroke="#0284c7" stroke-width="3.5" filter="drop-shadow(0 8px 24px rgba(2,132,199,0.15))"/>
    <circle cx="0" cy="0" r="148" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="4 3"/>
    
    <!-- Top process ID -->
    <rect x="-40" y="-120" width="80" height="26" rx="13" fill="#0284c7"/>
    <text x="0" y="-103" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">0.0</text>
    
    <!-- Process Title -->
    <text x="0" y="-55" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">BON LAUNDRY</text>
    <text x="0" y="-30" text-anchor="middle" font-size="16" font-weight="900" fill="#0f172a">Management System</text>
    <text x="0" y="-5" text-anchor="middle" font-size="14" font-weight="800" fill="#0284c7">with Predictive</text>
    <text x="0" y="20" text-anchor="middle" font-size="15" font-weight="900" fill="#0f172a">Analytics</text>
    
    <!-- Subtext -->
    <text x="0" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">(Central System Boundary)</text>
  </g>


  <!-- ==================== EXTERNAL ENTITIES ==================== -->

  <!-- 1. CUSTOMER ENTITY (Top-Left) -->
  <g id="entity-customer" transform="translate(240, 320)">
    <rect x="-110" y="-70" width="220" height="140" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.06))"/>
    <rect x="-110" y="-70" width="220" height="36" rx="14" fill="#0284c7"/>
    <rect x="-110" y="-45" width="220" height="11" fill="#0284c7"/>
    <text x="0" y="-47" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">CUSTOMER</text>
    <text x="0" y="-12" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">«External Entity»</text>
    <text x="0" y="10" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Online Residents</text>
    <text x="0" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Drop-off / Delivery Clients</text>
    <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Self-service Trackers</text>
  </g>

  <!-- 2. STAFF ENTITY (Bottom-Left) -->
  <g id="entity-staff" transform="translate(240, 800)">
    <rect x="-110" y="-70" width="220" height="140" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2.5" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.06))"/>
    <rect x="-110" y="-70" width="220" height="36" rx="14" fill="#059669"/>
    <rect x="-110" y="-45" width="220" height="11" fill="#059669"/>
    <text x="0" y="-47" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">STAFF</text>
    <text x="0" y="-12" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">«External Entity»</text>
    <text x="0" y="10" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Front-Desk Cashiers</text>
    <text x="0" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Laundry Operators</text>
    <text x="0" y="46" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Floor Machine Handlers</text>
  </g>

  <!-- 3. MANAGER ENTITY (Right Center) -->
  <g id="entity-manager" transform="translate(1560, 560)">
    <rect x="-110" y="-80" width="220" height="160" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.06))"/>
    <rect x="-110" y="-80" width="220" height="36" rx="14" fill="#7c3aed"/>
    <rect x="-110" y="-55" width="220" height="11" fill="#7c3aed"/>
    <text x="0" y="-57" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">MANAGER (ADMIN)</text>
    <text x="0" y="-22" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">«External Entity»</text>
    <text x="0" y="0" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• System Administrator</text>
    <text x="0" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Business Owner</text>
    <text x="0" y="36" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Operations Supervisor</text>
    <text x="0" y="54" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">• Analytics Evaluator</text>
  </g>


  <!-- ==================== DATA FLOWS: CUSTOMER <--> SYSTEM ==================== -->

  <!-- Customer -> System: Booking Details -->
  <path d="M 350 280 C 520 280 620 420 745 480" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="420" y="325" width="235" height="22" rx="6" fill="#ffffff" stroke="#e0f2fe" stroke-width="1"/>
  <text x="537" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Booking Details (Date, Exact Time, Package)</text>

  <!-- Customer -> System: Payment & Tracking Query -->
  <path d="M 350 340 C 500 350 630 460 740 520" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="440" y="390" width="220" height="22" rx="6" fill="#ffffff" stroke="#e0f2fe" stroke-width="1"/>
  <text x="550" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">Payment (Cash/Online) &amp; Order ID Query</text>

  <!-- System -> Customer: Confirmation & Live Queue / EWT -->
  <path d="M 750 440 C 620 360 520 230 350 240" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
  <rect x="430" y="240" width="235" height="22" rx="6" fill="#ffffff" stroke="#e0f2fe" stroke-width="1"/>
  <text x="547" y="255" text-anchor="middle" font-size="11" font-weight="800" fill="#0284c7">Order ID Ticket, Live Queue Progress &amp; EWT</text>

  <!-- System -> Customer: Lobby & Ready Notice -->
  <path d="M 770 470 C 650 400 500 270 330 250" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-blue)"/>
  <rect x="420" y="180" width="240" height="22" rx="6" fill="#ffffff" stroke="#e0f2fe" stroke-width="1"/>
  <text x="540" y="195" text-anchor="middle" font-size="11" font-weight="800" fill="#0284c7">Real-time Machine Lobby &amp; Order Ready Notice</text>


  <!-- ==================== DATA FLOWS: STAFF <--> SYSTEM ==================== -->

  <!-- Staff -> System: POS Details & Weight -->
  <path d="M 350 760 C 500 750 630 650 740 600" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <rect x="420" y="680" width="240" height="22" rx="6" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
  <text x="540" y="695" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Walk-in POS Data (Weight, Bundle, Intake)</text>

  <!-- Staff -> System: Machine Operation & Status -->
  <path d="M 350 820 C 520 820 630 710 745 645" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <rect x="430" y="745" width="240" height="22" rx="6" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
  <text x="550" y="760" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">Machine Cycle Start &amp; Hardware Status (Avail/Maint)</text>

  <!-- System -> Staff: Queue & Machine Timers -->
  <path d="M 750 670 C 640 760 520 870 350 860" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-emerald)"/>
  <rect x="430" y="820" width="250" height="22" rx="6" fill="#ffffff" stroke="#dcfce7" stroke-width="1"/>
  <text x="555" y="835" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">Active Queue Orders, Cycle Timers &amp; POS Price</text>


  <!-- ==================== DATA FLOWS: MANAGER <--> SYSTEM ==================== -->

  <!-- Manager -> System: Settings, Pricing & Accounts -->
  <path d="M 1450 510 C 1300 480 1180 500 1065 520" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="1130" y="470" width="255" height="22" rx="6" fill="#ffffff" stroke="#f3e8ff" stroke-width="1"/>
  <text x="1257" y="485" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">Pricing Rates, Service Charges &amp; User Accounts</text>

  <!-- System -> Manager: Peak Footfall Forecast & MAPE -->
  <path d="M 1065 560 C 1180 560 1300 550 1450 550" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <rect x="1130" y="535" width="265" height="22" rx="6" fill="#ffffff" stroke="#f3e8ff" stroke-width="1"/>
  <text x="1262" y="550" text-anchor="middle" font-size="11" font-weight="800" fill="#6d28d9">Peak Demand Predictions (Polynomial Curve &amp; MAPE)</text>

  <!-- System -> Manager: Ghost Slots & Audit Reports -->
  <path d="M 1065 600 C 1180 620 1300 620 1450 610" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-purple)"/>
  <rect x="1135" y="605" width="260" height="22" rx="6" fill="#ffffff" stroke="#f3e8ff" stroke-width="1"/>
  <text x="1265" y="620" text-anchor="middle" font-size="11" font-weight="800" fill="#6d28d9">Habitual Ghost Slots &amp; Revenue / Fleet Usage Reports</text>

</svg>

</body>
</html>
