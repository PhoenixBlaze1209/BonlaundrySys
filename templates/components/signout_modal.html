<!-- Reusable Sign Out Confirmation Modal -->
<div id="signout-confirm-modal" 
    class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm transition-opacity duration-200 opacity-0 pointer-events-none" 
    role="dialog" 
    aria-modal="true" 
    aria-labelledby="signout-modal-title">
    
    <div id="signout-modal-card" 
        class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-sm w-full p-6 text-center transform transition-all duration-200 scale-95 opacity-0 space-y-4">
        
        <!-- Icon Badge -->
        <div class="w-14 h-14 rounded-2xl bg-rose-50 border border-rose-100 text-rose-600 flex items-center justify-center mx-auto shadow-sm">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        </div>

        <!-- Heading & Details -->
        <div class="space-y-1.5">
            <h3 id="signout-modal-title" class="text-base font-bold text-slate-900">
                Confirm Sign Out
            </h3>
            <p class="text-xs text-slate-500 leading-relaxed">
                Are you sure you want to end your current session? You will need to sign back in to access your portal.
            </p>
        </div>

        <!-- Current User Active Badge -->
        {% if role or manager_name or staff_name or customer_name %}
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-slate-50 border border-slate-200 rounded-full text-[11px] font-semibold text-slate-600">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Active: <strong class="text-slate-900">{{ manager_name or staff_name or customer_name or role }}</strong></span>
        </div>
        {% endif %}

        <!-- Modal Actions -->
        <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-slate-100">
            <button type="button" onclick="closeSignOutModal()"
                class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs hover:bg-slate-50 transition cursor-pointer">
                Cancel
            </button>
            <a href="{{ url_for('auth.logout') }}" id="signout-confirm-btn"
                class="w-full px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm transition flex items-center justify-center gap-1.5 cursor-pointer">
                <span>Sign Out</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </a>
        </div>
    </div>
</div>

<script>
    function openSignOutModal() {
        const modal = document.getElementById('signout-confirm-modal');
        const card = document.getElementById('signout-modal-card');
        if (!modal || !card) return;
        
        modal.classList.remove('pointer-events-none', 'opacity-0');
        modal.classList.add('opacity-100');
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
        document.body.classList.add('overflow-hidden');
    }

    function closeSignOutModal() {
        const modal = document.getElementById('signout-confirm-modal');
        const card = document.getElementById('signout-modal-card');
        if (!modal || !card) return;

        card.classList.remove('scale-100', 'opacity-100');
        card.classList.add('scale-95', 'opacity-0');
        modal.classList.remove('opacity-100');
        modal.classList.add('opacity-0', 'pointer-events-none');
        document.body.classList.remove('overflow-hidden');
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeSignOutModal();
    });

    document.getElementById('signout-confirm-modal')?.addEventListener('click', function(e) {
        if (e.target === this) closeSignOutModal();
    });
</script>
