<!-- DYNAMIC SIDEBAR -->
<aside class="w-64 bg-slate-900 text-slate-400 flex flex-col justify-between p-6 shrink-0 h-screen">
    <div class="space-y-8">
        <!-- Brand Logo & Active Role Indicator -->
        <div class="px-2 text-white">
            <span class="text-xl font-black tracking-tight">BON<span class="text-[#00B4F4]">LAUNDRY</span></span>
            <div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mt-1">
                Access Tier: <span class="text-[#00B4F4]">{{ role | uppercase if role else 'STAFF' }}</span>
            </div>
        </div>
        
        <!-- Navigation Menu Links -->
        <nav class="space-y-1">
            <div class="pb-1 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-600">
                Operations
            </div>

            <!-- SHARED OPERATIONAL ACCESS -->
            <button data-target="view-dashboard" class="nav-btn active w-full flex items-center space-x-3 px-4 py-3 text-sm rounded-xl hover:bg-slate-800 transition-all text-left group">
                <svg class="w-4 h-4 text-slate-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"/></svg>
                <span>Dashboard Home</span>
            </button>

            <button data-target="view-pos" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 text-sm rounded-xl hover:bg-slate-800 transition-all text-left group">
                <svg class="w-4 h-4 text-slate-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                <span>POS Station</span>
            </button>

            <button data-target="view-queue" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 text-sm rounded-xl hover:bg-slate-800 transition-all text-left group">
                <svg class="w-4 h-4 text-slate-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17"/></svg>
                <span>Queue Control</span>
            </button>

            <button data-target="view-appointment" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 text-sm rounded-xl hover:bg-slate-800 transition-all text-left group">
                <svg class="w-4 h-4 text-slate-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                <span>Appointments</span>
            </button>

            <!-- MANAGERIAL ACCESS ONLY -->
            {% if role == 'manager' %}
            <div class="pt-4 pb-1 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-600 border-t border-slate-800 mt-4">
                Management Core
            </div>
            
            <button data-target="view-analytics" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 text-sm rounded-xl hover:bg-slate-800 transition-all text-left group">
                <svg class="w-4 h-4 text-[#00B4F4]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                <span class="text-[#00B4F4] font-bold">Predictive Analytics</span>
            </button>

            <button data-target="view-settings" class="nav-btn w-full flex items-center space-x-3 px-4 py-3 text-sm rounded-xl hover:bg-slate-800 transition-all text-left group">
                <svg class="w-4 h-4 text-slate-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>System Settings</span>
            </button>
            {% endif %}
        </nav>
    </div>
</aside>
