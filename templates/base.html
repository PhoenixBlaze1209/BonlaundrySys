<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bon Laundry{% endblock %}</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Boxicons (para sa mga icons ng sidebar kung mayroon man) -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        <!-- GLOBAL SIDEBAR NAVIGATION component -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between border-r border-slate-800">
            <div>
                <!-- Branding Area -->
                <div class="h-16 flex items-center px-6 bg-slate-950 border-b border-slate-800">
                    <span class="text-white font-black tracking-wider text-sm uppercase">
                        BON LAUNDRY <span class="text-emerald-500">//</span> APP
                    </span>
                </div>
                
                <!-- Navigation Menu Links -->
                <nav class="p-4 space-y-1">
                    <a href="/manager/dashboard" class="flex items-center space-x-3 px-4 py-3 text-sm font-medium text-white bg-slate-800 rounded-lg transition">
                        <i class='bx bx-grid-alt text-lg text-emerald-400'></i>
                        <span>Dashboard</span>
                    </a>
                    <!-- Maaari mong idagdag ang iba pang routes dito tulad ng Transactions, Inventory, atbp. -->
                </nav>
            </div>

            <!-- User Session Footer -->
            <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-xs font-semibold text-slate-200">Manager Portal</span>
                    <span class="text-[10px] text-slate-500 font-mono">v1.0.0-stable</span>
                </div>
                <a href="/logout" class="text-slate-500 hover:text-rose-400 transition" title="Sign Out">
                    <i class='bx bx-log-out text-lg'></i>
                </a>
            </div>
        </aside>

        <!-- DYNAMIC MAIN CONTENT WORKSPACE -->
        <div class="flex-1 flex flex-col overflow-hidden">
            {% block content %}
            <!-- Dito kusang ikakarga ng Jinja2 ang code mula sa dashboard.html -->
            {% endblock %}
        </div>
    </div>

</body>
</html>
