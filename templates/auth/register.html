<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a Bon Laundry Station customer account with Google Sign-In — no password required.">
    <title>Create Account — Bon Laundry Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bon.css') }}">
    <style>
        body { font-family: 'Archivo', sans-serif; }
    </style>
    <!-- Auto-redirect to /login which shows the unified Google sign-in portal -->
    <meta http-equiv="refresh" content="0; url={{ url_for('auth.login') }}">
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center">
    <div class="text-center space-y-4 p-8">
        <svg class="w-10 h-10 animate-spin text-sky-500 mx-auto" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <p class="text-sm text-slate-500">Taking you to Google Sign-In...</p>
        <p class="text-xs text-slate-400">
            If you are not redirected, <a href="{{ url_for('auth.login') }}" class="text-sky-600 underline">click here</a>.
        </p>
    </div>
</body>
</html>
